name: bls12-381-g1-ecdlp-plain
on:
  workflow_dispatch:
    inputs:
      yukon_evaluation:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    uses: Layr-Labs/llm-verifier/.github/workflows/verify.yml@f7b7a9972f5dda458bb34a02d5b04abad8f2121a
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: f7b7a9972f5dda458bb34a02d5b04abad8f2121a
      root_dir: '.'
      config_path: tracks/bls12-381-g1-ecdlp-plain/verifier.json
      submission_path: submission
      score_path: .yukon/bls12-381-g1-ecdlp-plain/score.json
      yukon_evaluation: ${{ inputs.yukon_evaluation }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPEN_AI_EIGEN_KEY }}
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
