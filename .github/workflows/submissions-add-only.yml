name: Submissions add-only
on: [pull_request]
permissions:
  contents: read
jobs:
  submissions-add-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject changes to existing submission files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --exit-code --name-status --no-renames --diff-filter=DMRTUXB \
            "$BASE_SHA...$HEAD_SHA" -- submissions/ || {
              echo 'Existing submissions cannot be modified, deleted, or renamed. Add new files instead.'
              exit 1
            }
