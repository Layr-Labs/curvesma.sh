name: Challenge tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned reference arithmetic for tests
        run: |
          python3 -m venv "$RUNNER_TEMP/curvesma-tests"
          "$RUNNER_TEMP/curvesma-tests/bin/python" -m pip install -r tests/requirements.txt
      - name: Check curve parameters and challenge definitions
        run: '"$RUNNER_TEMP/curvesma-tests/bin/python" -m unittest discover -s tests -v'
