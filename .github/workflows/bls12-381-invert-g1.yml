name: bls12-381-invert-g1
on:
  workflow_dispatch:
    inputs:
      yukon_evaluation:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    uses: Layr-Labs/llm-verifier/.github/workflows/verify.yml@PUBLISH_EXPLORATORY_VERIFIER_COMMIT
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: PUBLISH_EXPLORATORY_VERIFIER_COMMIT
      root_dir: 'tracks/bls12-381-invert-g1'
      config_path: verifier.json
      submission_path: submission
      score_path: .yukon/bls12-381-invert-g1/score.json
      yukon_evaluation: ${{ inputs.yukon_evaluation }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPEN_AI_EIGEN_KEY }}
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
