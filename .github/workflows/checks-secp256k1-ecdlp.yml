name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@PUBLISH_EXPLORATORY_VERIFIER_COMMIT
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: PUBLISH_EXPLORATORY_VERIFIER_COMMIT
      root_dir: 'tracks/secp256k1-ecdlp'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}
